<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gut Run</title>
  <link rel="icon" href="data:," />
</head>

<body>
  <div id="ad">
    <div id="stage">
      <div class="bleed"></div>
      <img class="layer" src="./assets-opt/bg.jpg" alt="" />
      <img class="layer texture" src="./assets-opt/01_game/bg_texture.png" alt="" />
      <img class="layer texture texture-fill" src="./assets-opt/01_game/bg_texture.png" alt="" />
      <div class="layer" id="game"></div>
      <img class="layer" src="./assets-opt/border.png" alt="" />
      <img class="layer" src="./assets-opt/logo.png" alt="" />
      <div class="bleed-edge"></div>
      <img class="layer" id="tut" src="./assets-opt/01_game/tut.png" alt="Bringe Poo durch den Darm ans Ziel." />
      <img class="gesture" id="gesture" src="./assets-opt/gesture.png" alt="Tap to run" />
      <div class="endcard" id="fail" hidden>
        <img class="layer bubble" src="./assets-opt/02_endcard/fail/bubble.png" alt="" />
        <img class="layer bac" src="./assets-opt/02_endcard/fail/bac1.png" alt="" />
        <img class="layer bac" src="./assets-opt/02_endcard/fail/bac2.png" alt="" />
        <img class="layer bac" src="./assets-opt/02_endcard/fail/bac3.png" alt="" />
        <img class="layer bac" src="./assets-opt/02_endcard/fail/bac4.png" alt="" />
        <img class="layer bac" src="./assets-opt/02_endcard/fail/bac5.png" alt="" />
        <img class="layer sad" src="./assets-opt/02_endcard/fail/sad.png" alt="" />
        <img class="layer hl" src="./assets-opt/02_endcard/fail/hl.png"
          alt="Poo, das tat weh! Erfahre jetzt, was deinem Darm guttut." />
        <button class="cta" type="button" data-click="cta">
          <img src="./assets-opt/02_endcard/fail/cta.png" alt="Jetzt informieren!" />
        </button>
        <button class="replay" type="button" data-click="replay">
          <img src="./assets-opt/02_endcard/fail/replay.png" alt="Nochmal spielen" />
        </button>
      </div>
      <div class="endcard" id="win" hidden>
        <img class="layer bubble" src="./assets-opt/02_endcard/win/bubble.png" alt="" />
        <img class="layer konfetti" src="./assets-opt/02_endcard/win/konfetti.png" alt="" />
        <img class="layer happy" src="./assets-opt/02_endcard/win/happy.png" alt="" />
        <img class="layer hl" src="./assets-opt/02_endcard/win/hl.png"
          alt="Poo, tut das gut! Wenn du weißt, was dein Darm braucht." />
        <button class="cta" type="button" data-click="cta">
          <img src="./assets-opt/02_endcard/win/cta.png" alt="Jetzt mehr erfahren" />
        </button>
      </div>
      <button class="mute" id="mute" type="button" aria-label="Ton aus" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="speaker" d="M3 9h4l5-4v14l-5-4H3z" />
          <path class="waves" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" />
          <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" />
        </svg>
      </button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
