<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Gut Run</title>
</head>

<body>
  <div id="ad">
    <div id="stage">
      <div class="bleed"></div>
      <img class="layer" src="./assets-opt/bg.jpg" alt="" />
      <img class="layer texture" src="./assets-opt/01_game/bg_texture.png" alt="" />
      <div class="layer" id="game"></div>
      <img class="layer" src="./assets-opt/border.png" alt="" />
      <img class="layer" src="./assets-opt/logo.png" alt="" />
      <div class="bleed-edge"></div>
      <img class="layer" id="tut" src="./assets-opt/01_game/tut.png" alt="Bringe Poo durch den Darm ans Ziel." />
      <img class="gesture" id="gesture" src="./assets-opt/gesture.png" alt="Tap to run" />
      <!-- Last in #stage: stays above the game and, later, the endcards. -->
      <button class="mute" id="mute" type="button" aria-label="Ton aus" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path class="speaker" d="M3 9h4l5-4v14l-5-4H3z" />
          <path class="waves" d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" />
          <path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" />
        </svg>
      </button>
    </div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>

</html>
