<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <title>Fireplace preview</title>
  <link rel="icon" href="data:," />
  <style>
    html,
    body {
      margin: 0;
      background: #282728;
    }

    .fireplace {
      display: grid;
      grid-template-columns: 320px 1032px 320px;
      grid-template-rows: 250px 725px;
      width: 1672px;
      transform-origin: 0 0;
    }

    .stage {
      margin: 0 auto;
      overflow: hidden;
    }

    .fireplace iframe {
      display: block;
      border: 0;
    }

    .left {
      grid-column: 1;
      grid-row: 1 / 3;
    }

    .top {
      grid-column: 2;
      grid-row: 1;
    }

    .right {
      grid-column: 3;
      grid-row: 1 / 3;
    }

    .site {
      grid-column: 2;
      grid-row: 2;
    }
  </style>
</head>

<body>
  <div class="stage">
  <main class="fireplace">
    <iframe class="left" src="./left/left.html" width="320" height="975" scrolling="no" title="Fireplace left"></iframe>
    <iframe class="top" src="./top/top.html" width="1032" height="250" scrolling="no" title="Fireplace top"></iframe>
    <iframe class="right" src="./right/right.html" width="320" height="975" scrolling="no" title="Fireplace right"></iframe>
    <div class="site"></div>
  </main>
  </div>
  <script>
    // Narrower windows see the whole fireplace scaled down, like browser zoom; the parts inside
    // still render at their own fixed size. ?actual shows it 1:1.
    const stage = document.querySelector('.stage');
    const fireplace = document.querySelector('.fireplace');
    const actual = new URLSearchParams(location.search).has('actual');
    function fit() {
      const s = actual ? 1 : Math.min(1, document.documentElement.clientWidth / 1672);
      fireplace.style.transform = `scale(${s})`;
      stage.style.width = `${1672 * s}px`;
      stage.style.height = `${975 * s}px`;
    }
    addEventListener('resize', fit);
    fit();

    // Start coordinator: once all three parts are ready, give them one shared start time.
    const frames = [...document.querySelectorAll('iframe')].map((f) => f.contentWindow);
    const ready = new Set();
    addEventListener('message', (e) => {
      const d = e.data;
      if (!frames.includes(e.source) || !d || d.tag !== 'wtf-fireplace' || d.kind !== 'ready') return;
      e.source.postMessage({ tag: 'wtf-fireplace', kind: 'hold' }, '*');
      ready.add(d.part);
      if (ready.size === frames.length) {
        const at = Date.now() + 150; // every frame gets the message before this moment
        for (const w of frames) w.postMessage({ tag: 'wtf-fireplace', kind: 'start', at }, '*');
      }
    });
  </script>
</body>

</html>
